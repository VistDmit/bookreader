name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Базовый набор без torch и ctranslate2: самопроверка должна
      # проходить и без моделей (этапы с моделями пропускают себя сами).
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: self-test
        run: python run_bookreader.py test

      - name: help
        run: python run_bookreader.py --help

      - name: doctor
        run: python run_bookreader.py doctor